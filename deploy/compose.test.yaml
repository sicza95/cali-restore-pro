# Dedicated disposable DB: integration tests never target the application DB.
services:
  test-db:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: calirestore_test
      POSTGRES_PASSWORD: disposable-test-password-0000000000
    tmpfs: ['/var/lib/postgresql:rw,nosuid,size=256m']
    networks: [backend]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, calirestore_test]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    image: calirestore-test:local
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://postgres:disposable-test-password-0000000000@test-db:5432/calirestore_test?sslmode=disable
    networks: [backend]
    depends_on:
      test-db: { condition: service_healthy }
