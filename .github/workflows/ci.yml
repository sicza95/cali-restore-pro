name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and format
        run: npm run check
      - name: Generated API client is current
        run: npm run api:generate && git diff --exit-code -- src/platform/api
      - name: Dependency audit (high, allowlist in scripts/audit-allowlist.json)
        run: npm run audit
      - name: App build
        run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - name: Storybook browser tests
        run: npm test

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Platform unit tests
        run: npm run test:unit
      # Playwright runner, no browser or server: the estimate calculation oracles.
      - name: Estimate oracle tests
        run: npm run test:estimates

  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      # Same image as deploy/compose.test.yaml: a disposable database, never the app's.
      test-db:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_DB: calirestore_test
          POSTGRES_PASSWORD: disposable-test-password-0000000000
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d calirestore_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:disposable-test-password-0000000000@localhost:5432/calirestore_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go mod download && go mod verify
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Informational (#51): never blocks a merge. Linux only, since Windows WebKit lacks
  # OffscreenCanvas. Known gaps per engine: docs/browser-support.md.
  browsers:
    name: Files suite (${{ matrix.browser }}, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      FILES_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:files
      - name: Failure context
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: files-${{ matrix.browser }}-results
          path: test-results/encrypted-files/**/error-context.md
          retention-days: 7

  # Report-only (#50): desktop Chromium profile of an 8K import, a zoom/pan/draw loop and an
  # export. Never blocks a merge; the budgets are provisional until iPad numbers exist (#49).
  # Method and budgets: docs/plan/perf-budgets.md.
  perf:
    name: Desktop perf profile (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:perf
      - name: Compare with budgets and baseline (warnings only)
        if: always()
        run: npm run perf:compare
      - name: Profile JSON
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-profile
          path: perf-results/profile.json
          retention-days: 14

  e2e:
    name: Platform E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:secrets
      - run: docker compose config --quiet
      - run: docker compose --profile dev up --build -d --wait
      - name: Quiesced backup and isolated restore
        run: node scripts/backup-smoke.mjs deploy/backups/ci calirestore-restore-ci
      - name: Identity smoke
        run: node scripts/identity-smoke.mjs
        env:
          IDENTITY_SMOKE_DISPOSABLE: '1'
      - run: npm run test:platform
      - run: npx playwright install --with-deps chromium
      - run: npm run test:sync
      - run: npm run test:files
      - run: npm run test:app
        env:
          IDENTITY_SMOKE_DISPOSABLE: '1'
          SMOKE_ORIGIN: http://localhost:8080
      - name: Encrypted file transfer and restart
        run: node scripts/encrypted-files-smoke.mjs
        env:
          IDENTITY_SMOKE_DISPOSABLE: '1'
          SMOKE_ORIGIN: http://localhost:8080
      - name: Restore a pre-revocation and pre-deletion operational archive
        env:
          COMPOSE_PROJECT_NAME: m07-test-source
          APP_PORT: '18097'
          MAIL_PORT: '18098'
        run: |
          docker compose --profile dev up -d --wait
          node scripts/operational-backup-smoke.mjs m07-test-target
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup disposable CI projects
        if: always()
        run: |
          docker compose -p m07-test-source --profile dev down -v
          docker compose -p m07-test-target down -v
          docker compose -p m07-test-target-interrupted down -v
          docker compose -p calirestore-restore-ci down -v
          docker compose --profile dev down -v
